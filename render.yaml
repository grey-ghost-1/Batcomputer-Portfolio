services:
  - type: web
    name: batcomputer-portfolio
    runtime: python
    plan: free
    branch: agents/batcomputer-website-query
    buildCommand: python -m pip install --disable-pip-version-check --requirement requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile - app:app
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SITE_ENVIRONMENT
        value: production
      - key: SITE_HOSTED_MODE
        value: "true"
      - key: SITE_PROPOSALS_ENABLED
        value: "false"
      - key: SITE_SESSION_SECRET
        generateValue: true
