          fill="#0a0a0a" stroke="#00aaff" stroke-width="5" stroke-linejoin="round"/>

    <path d="M540 300 C620 330, 680 350, 760 350 C840 350, 900 330, 980 300 C930 388, 860 430, 760 448 C660 430, 590 388, 540 300 Z"
          fill="#050608" stroke="#00aaff" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <path d="M680 145 L760 54 L840 145" stroke="#00aaff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M470 255 L545 220" stroke="#00aaff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M1050 255 L975 220" stroke="#00aaff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
