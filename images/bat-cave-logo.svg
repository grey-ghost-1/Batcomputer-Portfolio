  <path d="M1030 370 L1075 310 L1120 370 L1165 310 L1210 370" stroke="#05090d" stroke-width="8" stroke-linejoin="round" fill="none"/>

  <g filter="url(#softGlow)">
    <path d="M300 170 C420 70, 590 40, 760 120 C850 170, 1030 70, 1160 180 C1095 190, 1030 230, 980 255 C930 195, 850 170, 760 170 C670 170, 590 195, 540 255 C490 230, 425 190, 300 170 Z"
