<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Futuristic Bat Cave">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="caveGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d3d6d"/>
      <stop offset="40%" stop-color="#1191ff"/>
      <stop offset="100%" stop-color="#005bb5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>

  <path d="M0 355 L120 315 L220 345 L340 295 L500 350 L620 300 L740 350 L860 310 L980 350 L1100 320 L1260 350 L1600 330 L1600 520 L0 520 Z"
