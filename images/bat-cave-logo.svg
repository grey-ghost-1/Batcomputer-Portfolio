    <path d="M360 240 C430 215, 500 210, 580 232 C550 240, 500 255, 440 284 C420 270, 390 255, 360 240 Z"
          fill="#0a0a0a" stroke="#00aaff" stroke-width="5" stroke-linejoin="round"/>

