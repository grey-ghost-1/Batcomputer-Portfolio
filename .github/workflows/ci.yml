name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Validate flagship migration
        working-directory: platform
        env:
          PLATFORM_ENVIRONMENT: test
          PLATFORM_DATABASE_URL: sqlite:///./migration-check.db
          PLATFORM_SECRET_KEY: ci-only-secret-that-is-long-enough-for-tests
        run: python -m alembic -c alembic.ini upgrade head

      - name: Test flagship platform
        working-directory: platform
        run: python -m pytest tests -q

      - name: Test orbital data lab
        working-directory: orbital-data-lab
        run: python -m pytest tests -q

      - name: Test algorithm quality lab
        working-directory: algorithms-quality
        run: python -m pytest tests -q

      - name: Test Alfred local assistant
        working-directory: alfred-assistant
        run: python -m pytest tests -q

      - name: Lint Python
        run: python -m ruff check app.py site_config.py scripts tests platform orbital-data-lab algorithms-quality alfred-assistant

      - name: Compile Python modules
        run: python -m compileall -q app.py site_config.py scripts tests platform orbital-data-lab algorithms-quality alfred-assistant

      - name: Type-check Alfred service
        run: python -m mypy --check-untyped-defs --disallow-untyped-defs --no-implicit-optional alfred-assistant/alfred

      - name: Validate Alfred console JavaScript
        run: node --check alfred-assistant/ui/console.js

      - name: Validate container configuration
        run: docker compose config --quiet
